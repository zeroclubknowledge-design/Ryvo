<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Ryvo — You're offline</title>
<style>
  @font-face { font-family: Ryvo; src: url("/fonts/Montserrat-Variable.ttf") format("truetype"); font-weight: 100 900; font-display: swap; }
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: radial-gradient(70% 50% at 50% 40%, #2a1450 0%, #050505 70%); color: #f5f5f3; font-family: Ryvo, Arial, sans-serif; text-align: center; }
  img { width: 88px; height: 88px; object-fit: contain; margin-bottom: 28px; }
  h1 { margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -.04em; line-height: 1.05; }
  p { max-width: 30ch; margin: 14px auto 28px; color: #a0a29e; font-size: 14px; line-height: 1.6; }
  button { min-height: 48px; padding: 0 26px; border: 0; border-radius: 999px; background: #60b800; color: #112206; font: 700 14px Ryvo, Arial, sans-serif; cursor: pointer; }
  button:focus-visible { outline: 2px solid #f5f5f3; outline-offset: 3px; }
</style>
</head>
<body>
  <main>
    <img src="/ryvo-logo-mark.png" alt="">
    <h1>You're offline.</h1>
    <p>Your boards and wallet need a connection. Reconnect and we'll pick up where you left off.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
